apiVersion: apps/v1
kind: Deployment
metadata:
  name: jcmcp-qa
  namespace: jcmcp-qa
  labels:
    app: jcmcp-qa
spec:
  replicas: 1
  # Recreate is deliberate — SQLite on a ReadWriteOnce PVC must never have two
  # writers. See k8s/deployment.yaml for the full rationale.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jcmcp-qa
  template:
    metadata:
      labels:
        app: jcmcp-qa
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: jcmcp-workload-sa
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: seed-workspace
          image: mcr.microsoft.com/azure-cli:2.61.0
          command:
            - sh
            - -c
            - |
              set -e
              # Same contract as prod (see k8s/deployment.yaml): the PVC is
              # the source of truth, blob is a 15-min backup written FROM it.
              # Seed only an empty volume — an unconditional restore reverts
              # any write from the last ~15 min before a restart.
              if [ -d /app/data/users ] && [ -n "$(ls -A /app/data/users 2>/dev/null)" ]; then
                echo "QA data volume already populated ($(find /app/data/users -type f | wc -l) files) — skipping blob restore; PVC state wins."
              else
                echo "Empty QA data volume — seeding tenant data from Blob Storage..."
                az login \
                  --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                  --service-principal \
                  -u "$AZURE_CLIENT_ID" \
                  --tenant "$AZURE_TENANT_ID" \
                  --output none
                mkdir -p /app/data/users
                az storage blob download-batch \
                  --account-name "${STORAGE_ACCOUNT}" \
                  --source workspace \
                  --pattern "users/*" \
                  --destination /app/data \
                  --overwrite true \
                  --auth-mode login \
                  --output none && echo "QA tenant data restored ($(find /app/data/users -type f | wc -l) files)." || echo "No QA tenant data in blob yet (first boot)."
              fi
              rm -rf /app/data/data /app/data/workspace/data
              echo "QA seed complete."
          env:
            - name: STORAGE_ACCOUNT
              valueFrom:
                configMapKeyRef:
                  name: jcmcp-qa-config
                  key: storage_account
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: jcmcp-qa
          image: <ACR_NAME>.azurecr.io/jcmcp:<IMAGE_TAG>
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: START_MODE
              value: "http"
            - name: USE_SQLITE
              value: "1"
            # SQLite is the sole source of truth in the cloud. Reads already
            # prefer it (lib/io._load_json); this stops the redundant JSON
            # dual-write, which drifted from the tables and — because the
            # data JSONs are ALSO file-synced — shipped that drift to peers
            # as a second, competing channel. Desktop stays dual-write.
            - name: SQLITE_ONLY
              value: "1"
            - name: ENABLE_REMOTE
              value: "true"
            - name: SERVER_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: server_base_url
                  optional: true
            - name: DISABLE_REBINDING_CHECK
              value: "true"
            - name: ENTRA_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: entra_tenant_id
            - name: ENTRA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: entra_client_id
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: entra_client_secret
            - name: ENTRA_OWNER_OID
              valueFrom:
                configMapKeyRef:
                  name: jcmcp-qa-config
                  key: entra_owner_oid
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: llm_provider
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: llm_api_key
                  optional: true
            # Eval-judge split — same optional pattern as prod (k8s/deployment.yaml).
            - name: JUDGE_LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: judge_llm_provider
                  optional: true
            - name: JUDGE_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: judge_llm_model
                  optional: true
            - name: JUDGE_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: judge_llm_api_key
                  optional: true
            # Oura Ring OAuth client credentials. Optional: when absent the
            # connect flow shows "not enabled" instead of erroring. Add the
            # keys to jcmcp-qa-app-secrets and restart to turn it on.
            - name: OURA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: oura_client_id
                  optional: true
            - name: OURA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: oura_client_secret
                  optional: true
            # App-wide key for encrypting secrets at rest (per-user OAuth
            # tokens). Optional: when absent, tokens are stored in cleartext.
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: jcmcp-qa-app-secrets
                  key: app_encryption_key
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "512Mi"
            limits:
              cpu: "500m"   # half of prod — QA doesn't need full burst capacity
              memory: "1Gi"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # Liveness never checks a dependency; readiness does (JWKS cached).
          # Probe timeouts raised from the 1s default: in-request LLM work
          # stalls the GIL-bound process past 1s and got a healthy prod pod
          # liveness-killed mid-generation (2026-08-27). Mirrors prod.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
        - name: workspace-sync
          image: mcr.microsoft.com/azure-cli:2.61.0
          command:
            - sh
            - -c
            - |
              set -e
              echo "QA Tenant sync sidecar ready. Backing up + pruning every 15 min."
              while true; do
                sleep 900
                az login \
                  --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                  --service-principal \
                  -u "$AZURE_CLIENT_ID" \
                  --tenant "$AZURE_TENANT_ID" \
                  --output none 2>/dev/null
                if [ -d /app/data/users ] && [ -n "$(ls -A /app/data/users 2>/dev/null)" ]; then
                  if az storage blob upload-batch \
                      --account-name "${STORAGE_ACCOUNT}" \
                      --source /app/data/users \
                      --destination workspace \
                      --destination-path users \
                      --overwrite true \
                      --auth-mode login \
                      --output none 2>/dev/null; then
                    # Delete propagation WITHOUT azcopy: `az storage blob sync` downloads
                    # azcopy at runtime and this cluster's egress blocks that (2026-08-23:
                    # every tick failed with "Name does not resolve" fetching azcopy
                    # 10.13.0 — transfers seen in the log were the fallback's). Pure-CLI
                    # prune instead: list blobs, subtract local files, delete the extras.
                    # Guards, because a prune can DELETE backup blobs: the tenant SQLite
                    # db must exist (suspect volume: no prune) and >=10 local files (a
                    # nearly-empty volume must never empty the backup). The upload above
                    # already succeeded either way — a skipped prune degrades tidiness,
                    # never contents.
                    local_count=$(find /app/data/users -type f | wc -l)
                    if [ -z "$(find /app/data/users -name 'jobcontextmcp.db' -print -quit 2>/dev/null)" ]; then
                      echo "[$(date -u +%H:%M:%SZ)] QA tenant backup OK (prune skipped — no tenant db, volume suspect)"
                    elif [ "$local_count" -lt 10 ]; then
                      echo "[$(date -u +%H:%M:%SZ)] QA tenant backup OK (prune skipped — only $local_count local files)"
                    else
                      (cd /app/data && find users -type f) > /tmp/local.txt
                      if az storage blob list \
                          --account-name "${STORAGE_ACCOUNT}" \
                          --container-name workspace \
                          --prefix users/ \
                          --num-results "*" \
                          --query "[].name" -o tsv \
                          --auth-mode login > /tmp/blobs.txt 2>/dev/null; then
                        grep -vxF -f /tmp/local.txt /tmp/blobs.txt > /tmp/extras.txt || true
                        pruned=0
                        failed=0
                        while IFS= read -r blob; do
                          [ -n "$blob" ] || continue
                          az storage blob delete \
                            --account-name "${STORAGE_ACCOUNT}" \
                            --container-name workspace \
                            --name "$blob" \
                            --auth-mode login \
                            --output none 2>/dev/null && pruned=$((pruned+1)) || failed=$((failed+1))
                        done < /tmp/extras.txt
                        echo "[$(date -u +%H:%M:%SZ)] QA tenant mirror OK (backup fresh, $pruned stale blobs pruned, $failed delete failures)"
                      else
                        echo "[$(date -u +%H:%M:%SZ)] QA tenant backup OK (prune skipped — blob list failed)"
                      fi
                    fi
                  else
                    echo "[$(date -u +%H:%M:%SZ)] QA tenant sync FAILED"
                  fi
                else
                  echo "[$(date -u +%H:%M:%SZ)] no qa tenant data to sync yet"
                fi
              done
          env:
            - name: STORAGE_ACCOUNT
              valueFrom:
                configMapKeyRef:
                  name: jcmcp-qa-config
                  key: storage_account
          resources:
            requests:
              cpu: "5m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jcmcp-qa-data
        - name: config
          configMap:
            name: jcmcp-qa-config
