apiVersion: apps/v1
kind: Deployment
metadata:
  name: jcmcp
  namespace: jcmcp
  labels:
    app: jcmcp
spec:
  replicas: 1
  # Recreate is DELIBERATE and must stay. The datastore is SQLite on the
  # ReadWriteOnce jcmcp-data PVC (Azure Disk) and, since SQLITE_ONLY=1, it is
  # the sole source of truth. RollingUpdate with maxSurge>0 is unsafe in one
  # direction and useless in the other: a surge pod co-scheduled on the node
  # already holding the disk WOULD mount it and give two writers on one
  # SQLite file, and a surge pod on any other node blocks in
  # ContainerCreating until the disk detaches — a longer outage, not a
  # shorter one. The connector no longer needs the server to stay up across
  # a deploy (MCP runs stateless; see server.py), so the outage window is
  # survivable without changing this.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jcmcp
  template:
    metadata:
      labels:
        app: jcmcp
        azure.workload.identity/use: "true"
      annotations:
        # Azure Monitor managed Prometheus (ama-metrics) pod-annotation
        # scraping — requires podannotationnamespaceregex to include this
        # namespace in the ama-metrics-settings-configmap.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: jcmcp-workload-sa
      # Let in-flight MCP calls finish instead of being cut mid-response when
      # a deploy tears the pod down.
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: seed-workspace
          image: mcr.microsoft.com/azure-cli:2.61.0
          command:
            - sh
            - -c
            - |
              set -e
              # /app/data is the durable PVC and the SOURCE OF TRUTH; blob is
              # a backup written FROM this volume every 15 min by the
              # workspace-sync sidecar, never an independent source. Restoring
              # over a populated volume therefore always moves files BACKWARD:
              # any write in the ~15 min before a restart is not in the backup
              # yet, and an unconditional --overwrite restore silently
              # reverted it (confirmed 2026-08-22 — ate the same master-resume
              # corrections twice, with no error and no log). Seed ONLY an
              # empty volume: first boot, or disaster recovery onto a fresh
              # PVC. To force a full restore deliberately, empty
              # /app/data/users first (kubectl exec ... mv) and restart.
              if [ -d /app/data/users ] && [ -n "$(ls -A /app/data/users 2>/dev/null)" ]; then
                echo "Data volume already populated ($(find /app/data/users -type f | wc -l) files) — skipping blob restore; PVC state wins."
              else
                echo "Empty data volume — seeding tenant data from Blob Storage..."
                # Workload identity: federated token file is injected by the webhook.
                az login \
                  --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                  --service-principal \
                  -u "$AZURE_CLIENT_ID" \
                  --tenant "$AZURE_TENANT_ID" \
                  --output none
                # Restore all tenant data in one operation.
                # Blob layout: workspace/users/{oid}/workspace/...
                #                           users/{oid}/jobcontextmcp.db
                #                           users/{oid}/*.json
                # Restored to:  /app/data/users/{oid}/workspace/...
                #                           users/{oid}/jobcontextmcp.db
                #                           users/{oid}/*.json
                mkdir -p /app/data/users
                az storage blob download-batch \
                  --account-name "${STORAGE_ACCOUNT}" \
                  --source workspace \
                  --pattern "users/*" \
                  --destination /app/data \
                  --overwrite true \
                  --auth-mode login \
                  --output none && echo "Tenant data restored ($(find /app/data/users -type f | wc -l) files)." || echo "No tenant data in blob yet (first boot)."
              fi
              # Remove legacy root-level data trees left behind by the earlier
              # single-user layout. The live data model now lives under
              # /app/data/users/{oid}/, so these duplicates should never be
              # preserved across pod restarts.
              rm -rf /app/data/data /app/data/workspace/data
              echo "Seed complete."
          env:
            - name: STORAGE_ACCOUNT
              valueFrom:
                configMapKeyRef:
                  name: jcmcp-config
                  key: storage_account
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: jcmcp
          image: <ACR_NAME>.azurecr.io/jcmcp:<IMAGE_TAG>
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: START_MODE
              value: "http"
            # Nightly server-side golden-suite eval run (control-plane kind
            # run_evals) for the owner partition — 08:00 UTC ≈ 4am ET.
            - name: EVALS_NIGHTLY_HOUR_UTC
              value: "8"
            # MWF steady-state cadence (~$2-3/run): regression signal only
            # exists when generation/judge code deploys, drift is slow enough
            # for thrice-weekly detection, and variance is computed WITHIN a
            # run (N=5), so lower frequency loses nothing. Delete this var to
            # return to daily while actively iterating on the generator.
            - name: EVALS_NIGHTLY_DAYS_UTC
              value: "mon,wed,fri"
            - name: USE_SQLITE
              value: "1"
            # SQLite is the sole source of truth in the cloud. Reads already
            # prefer it (lib/io._load_json); this stops the redundant JSON
            # dual-write, which drifted from the tables and — because the
            # data JSONs are ALSO file-synced — shipped that drift to peers
            # as a second, competing channel. Desktop stays dual-write.
            - name: SQLITE_ONLY
              value: "1"
            - name: ENABLE_REMOTE
              value: "true"
            # Required alongside ENABLE_REMOTE to disable the MCP SDK's
            - name: SERVER_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: server_base_url
                  optional: true
            # DNS rebinding check when running behind the AKS nginx ingress.
            - name: DISABLE_REBINDING_CHECK
              value: "true"
            - name: ENTRA_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: entra_tenant_id
            - name: ENTRA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: entra_client_id
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: entra_client_secret
            - name: ENTRA_OWNER_OID
              valueFrom:
                configMapKeyRef:
                  name: jcmcp-config
                  key: entra_owner_oid
            # LLM_PROVIDER overrides llm_provider in config.json.
            # LLM_API_KEY is used as the API key regardless of provider
            # (openai_api_key for openai, azure_foundry_api_key for foundry).
            # Ollama needs no key — leave LLM_API_KEY secret blank.
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: llm_provider
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: llm_api_key
                  optional: true
            # Eval-judge split (docs/evals.md). All three optional: while the
            # secret keys are absent the nightly self-judges. Flipping is a
            # secret edit plus a restart — judge_llm_provider / judge_llm_model
            # / judge_llm_api_key on jcmcp-app-secrets, no manifest change.
            # Run the calibration pass against the blind labels BEFORE
            # pointing this at a new judge model.
            #
            # The wallboard no longer asserts which judge is live: the
            # eval_judge_info gauge (evals/ingest.py) stamps the judge that
            # actually produced the last SCORED run, and the panels read it.
            # So this secret can be flipped on its own schedule without a
            # matching dashboard edit, and a dashboard edit cannot outrun the
            # cluster. The panels carry the per-judge calibration table
            # instead, which is true whoever is running.
            - name: JUDGE_LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: judge_llm_provider
                  optional: true
            - name: JUDGE_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: judge_llm_model
                  optional: true
            - name: JUDGE_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: judge_llm_api_key
                  optional: true
            # SerpAPI key for employer-address enrichment (certification tool)
            # and job scraping. Optional: without it, enrichment falls back to
            # website scraping and the keyless DDG search.
            - name: SERPAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: serpapi_key
                  optional: true
            # Oura Ring OAuth client credentials. Optional: when absent the
            # connect flow shows "not enabled" instead of erroring. Add the
            # keys to jcmcp-app-secrets and restart to turn it on.
            - name: OURA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: oura_client_id
                  optional: true
            - name: OURA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: oura_client_secret
                  optional: true
            # App-wide key for encrypting secrets at rest (per-user OAuth
            # tokens). Optional: when absent, tokens are stored in cleartext
            # (prior behaviour). See lib/crypto.py.
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: jcmcp-app-secrets
                  key: app_encryption_key
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          lifecycle:
            preStop:
              exec:
                # Give the ingress time to pull this pod out of its upstream
                # set before uvicorn stops accepting, so requests already in
                # flight are not truncated.
                command: ["sh", "-c", "sleep 5"]
          # Liveness never checks a dependency: a transient Entra outage must
          # not get the pod killed.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          # Readiness DOES: /ready is 503 until the Entra JWKS is cached, so
          # the ingress does not route to a pod that would answer a valid
          # token with an auth error.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
        - name: workspace-sync
          image: mcr.microsoft.com/azure-cli:2.61.0
          command:
            - sh
            - -c
            - |
              set -e
              echo "Tenant sync sidecar ready. Mirroring every 15 min."
              # `az storage blob sync` shells out to azcopy, which does NOT
              # inherit the CLI's login on its own; this makes it reuse it.
              export AZCOPY_AUTO_LOGIN_TYPE=AZCLI
              while true; do
                sleep 900
                az login \
                  --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                  --service-principal \
                  -u "$AZURE_CLIENT_ID" \
                  --tenant "$AZURE_TENANT_ID" \
                  --output none 2>/dev/null
                # Mirror all tenants in one operation — sync, not accumulate:
                # a file deleted from the volume leaves the backup too, so a
                # disaster-recovery restore no longer resurrects every file
                # ever removed. Because a mirror can DELETE backup blobs, it
                # is guarded twice:
                #   1. an empty/missing users dir skips the tick entirely — a
                #      mirror from an unmounted or wiped volume would
                #      obediently delete the whole backup;
                #   2. a volume with no tenant SQLite db anywhere is suspect
                #      (half-mounted, mid-provision) and gets the old
                #      add-only upload-batch instead — a weird volume may
                #      degrade the backup's tidiness, never its contents.
                # upload-batch is also the fallback when the mirror itself
                # fails (azcopy missing, transient error), so a backup tick
                # never silently does nothing. Watch the log labels: "mirror
                # OK" is the healthy state; persistent "add-only fallback"
                # means deletes are not propagating and wants investigation.
                # Source: /app/data/users/{oid}/...
                # Dest:   workspace/users/{oid}/...
                if [ -d /app/data/users ] && [ -n "$(ls -A /app/data/users 2>/dev/null)" ]; then
                  # Mirror stderr is CAPTURED and printed on failure — a
                  # fail-soft path that discards its error is undiagnosable
                  # (learned 2026-08-23: the first live tick fell back and the
                  # log could name the fallback but not the reason).
                  mirror_out=""
                  mirror_ok=0
                  if [ -n "$(find /app/data/users -name 'jobcontextmcp.db' -print -quit 2>/dev/null)" ]; then
                    mirror_out="$(az storage blob sync \
                      --account-name "${STORAGE_ACCOUNT}" \
                      --container workspace \
                      --source /app/data/users \
                      --destination users \
                      --delete-destination true \
                      --only-show-errors 2>&1)" && mirror_ok=1
                  else
                    mirror_out="no tenant SQLite db found — volume suspect, mirror skipped"
                  fi
                  if [ "$mirror_ok" = "1" ]; then
                    echo "[$(date -u +%H:%M:%SZ)] tenant mirror OK (deletes propagated)"
                  else
                    echo "[$(date -u +%H:%M:%SZ)] mirror attempt failed — reason follows; add-only fallback engaged"
                    echo "$mirror_out" | tail -n 5
                    az storage blob upload-batch \
                      --account-name "${STORAGE_ACCOUNT}" \
                      --source /app/data/users \
                      --destination workspace \
                      --destination-path users \
                      --overwrite true \
                      --auth-mode login \
                      --output none \
                      && echo "[$(date -u +%H:%M:%SZ)] tenant sync OK (add-only fallback — mirror unavailable or volume suspect)" \
                      || echo "[$(date -u +%H:%M:%SZ)] tenant sync FAILED"
                  fi
                else
                  echo "[$(date -u +%H:%M:%SZ)] no tenant data to sync yet"
                fi
              done
          env:
            - name: STORAGE_ACCOUNT
              valueFrom:
                configMapKeyRef:
                  name: jcmcp-config
                  key: storage_account
          resources:
            requests:
              cpu: "5m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jcmcp-data
        - name: config
          configMap:
            name: jcmcp-config
