# Provisioned dashboard: jobContext Overview. Edit the JSON here (dashboards
# as code) — in-UI edits to this dashboard do not persist across restarts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-jobcontext
  namespace: monitoring
data:
  jobcontext-overview.json: |
    {
     "uid": "jobcontext-overview",
     "title": "jobContext Overview",
     "schemaVersion": 39,
     "refresh": "30s",
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "panels": [
      {
       "id": 1,
       "title": "Request rate by route",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum(rate(http_requests_total[5m])) by (route)",
         "legendFormat": "{{route}}",
         "refId": "A"
        }
       ]
      },
      {
       "id": 2,
       "title": "5xx error rate",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum(rate(http_requests_total{status=~\"5..\"}[5m]))",
         "legendFormat": "5xx",
         "refId": "A"
        }
       ]
      },
      {
       "id": 3,
       "title": "Avg request latency by route",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "rate(http_request_seconds_sum[5m]) / rate(http_request_seconds_count[5m])",
         "legendFormat": "{{route}}",
         "refId": "A"
        }
       ]
      },
      {
       "id": 4,
       "title": "Work items (1h) by kind/status",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "links": [{"title": "Per-kind detail \u2014 tokens, durations, failures, quota (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/work/stats", "targetBlank": true}], "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum(increase(work_items_total[1h])) by (kind, status)",
         "legendFormat": "{{kind}} {{status}}",
         "refId": "A"
        }
       ]
      },
      {
       "id": 5,
       "title": "Avg work-item duration",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 16,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "links": [{"title": "Per-kind detail \u2014 tokens, durations, failures, quota (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/work/stats", "targetBlank": true}], "unit": "s"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "rate(work_item_seconds_sum[15m]) / rate(work_item_seconds_count[15m])",
         "legendFormat": "{{kind}} ({{outcome}})",
         "refId": "A"
        }
       ]
      },
      {
       "id": 6,
       "title": "LLM calls by model/outcome",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 16,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "links": [{"title": "Per-kind detail \u2014 tokens, durations, failures, quota (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/work/stats", "targetBlank": true}], "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum(increase(llm_calls_total[1h])) by (model, outcome)",
         "legendFormat": "{{model}} {{outcome}}",
         "refId": "A"
        }
       ]
      },
      {
       "id": 7,
       "title": "LLM tokens/hour by direction",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 24,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "links": [{"title": "Per-kind detail \u2014 tokens, durations, failures, quota (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/work/stats", "targetBlank": true}], "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum(increase(llm_tokens_total[1h])) by (model, direction)",
         "legendFormat": "{{model}} {{direction}}",
         "refId": "A"
        }
       ]
      },
      {
       "id": 8,
       "title": "App uptime",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 24,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "process_uptime_seconds",
         "legendFormat": "{{pod}}",
         "refId": "A"
        }
       ]
      }
     ]
    }
  jobcontext-evals.json: |
    {
     "uid": "jobcontext-evals",
     "title": "jobContext Evals — resume quality",
     "schemaVersion": 39,
     "refresh": "1m",
     "time": {"from": "now-7d", "to": "now"},
     "panels": [
      {"id": 13, "type": "text", "title": "", "transparent": true,
       "gridPos": {"x": 0, "y": 0, "w": 20, "h": 3},
       "options": {"mode": "markdown", "content": "⚠️ **Accuracy is the weak dimension.** Calibrated accuracy MAE vs blind human labels, all at max_tokens=8000: `claude-sonnet-5` **1.48 / 1.56** over two N=5 passes — but calibrated on 4 of 5 golden entries, not 5, since on GD-03 it scores accuracy 5.0 against a human label of 1 with zero flags in both passes. `gpt-4.1-mini` **3.2**, returning a constant 5.0 on every entry — it does not rank them at all. `llama3.1:8b` **3.2**. A judge not on this list has no calibration table and its accuracy scores mean nothing yet (docs/evals.md). The panel to the right reports which judge actually produced the last run; if the two disagree, believe the panel."}},
      {"id": 14, "type": "stat", "title": "Judge (last scored run)",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 20, "y": 0, "w": 4, "h": 3},
       "targets": [{"expr": "eval_judge_info{namespace=\"jcmcp\"}", "refId": "A", "instant": true, "legendFormat": "{{judge}}"}],
       "options": {"textMode": "name", "colorMode": "none"},
       "fieldConfig": {"defaults": {"noValue": "NO SCORED RUN"}}},
      {"id": 1, "type": "stat", "title": "Mean judge score (worst entry)",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 0, "y": 3, "w": 5, "h": 6},
       "targets": [{"expr": "min(eval_mean_score{namespace=\"jcmcp\"})", "refId": "A", "instant": true}],
       "fieldConfig": {"defaults": {"min": 1, "max": 5, "decimals": 2,
        "thresholds": {"steps": [{"color": "red", "value": null},
         {"color": "green", "value": 4}]}}}},
      {"id": 2, "type": "stat", "title": "Hallucination rate (max)",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 5, "y": 3, "w": 5, "h": 6},
       "targets": [{"expr": "max(eval_hallucination_rate_pct{namespace=\"jcmcp\"})", "refId": "A", "instant": true}],
       "fieldConfig": {"defaults": {"links": [{"title": "Run detail \u2014 alerts, flips, flagged claims (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/evals/results", "targetBlank": true}], "unit": "percent", "decimals": 0,
        "thresholds": {"steps": [{"color": "green", "value": null},
         {"color": "red", "value": 0.001}]}}}},
      {"id": 3, "type": "stat", "title": "Verdict flip rate (max)",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 10, "y": 3, "w": 5, "h": 6},
       "targets": [{"expr": "max(eval_verdict_flip_rate_pct{namespace=\"jcmcp\"})", "refId": "A", "instant": true}],
       "fieldConfig": {"defaults": {"links": [{"title": "Run detail \u2014 alerts, flips, flagged claims (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/evals/results", "targetBlank": true}], "unit": "percent", "decimals": 0,
        "thresholds": {"steps": [{"color": "green", "value": null},
         {"color": "orange", "value": 20}]}}}},
      {"id": 4, "type": "stat", "title": "Layer 1 smoke pass rate",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 15, "y": 3, "w": 5, "h": 6},
       "targets": [{"expr": "eval_layer1_smoke_pass_rate_pct{namespace=\"jcmcp\"}", "refId": "A", "instant": true}],
       "fieldConfig": {"defaults": {"unit": "percent", "decimals": 0,
        "thresholds": {"steps": [{"color": "red", "value": null},
         {"color": "orange", "value": 95}, {"color": "green", "value": 100}]}}}},
      {"id": 5, "type": "stat", "title": "Active alerts",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 20, "y": 3, "w": 4, "h": 6},
       "targets": [{"expr": "sum(eval_alert_count{namespace=\"jcmcp\"}) or (0 * max(eval_last_run_timestamp_seconds{namespace=\"jcmcp\"}))", "refId": "A", "instant": true}],
       "fieldConfig": {"defaults": {"links": [{"title": "Run detail \u2014 alerts, flips, flagged claims (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/evals/results", "targetBlank": true}], "decimals": 0,
        "thresholds": {"steps": [{"color": "green", "value": null},
         {"color": "red", "value": 1}]}}}},
      {"id": 6, "type": "timeseries", "title": "Mean judge score by golden entry",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 0, "y": 9, "w": 12, "h": 9},
       "targets": [{"expr": "eval_mean_score{namespace=\"jcmcp\"}", "legendFormat": "{{gd_id}}", "refId": "A"}],
       "fieldConfig": {"defaults": {"links": [{"title": "Run detail \u2014 alerts, flips, flagged claims (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/evals/results", "targetBlank": true}], "min": 1, "max": 5, "custom": {"thresholdsStyle": {"mode": "line"}},
        "thresholds": {"steps": [{"color": "transparent", "value": null},
         {"color": "red", "value": 4}]}}}},
      {"id": 7, "type": "timeseries", "title": "CoV % by golden entry (instability)",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 12, "y": 9, "w": 12, "h": 9},
       "targets": [{"expr": "eval_cov_pct{namespace=\"jcmcp\"}", "legendFormat": "{{gd_id}}", "refId": "A"}],
       "fieldConfig": {"defaults": {"links": [{"title": "Run detail \u2014 alerts, flips, flagged claims (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/evals/results", "targetBlank": true}], "unit": "percent", "min": 0, "custom": {"thresholdsStyle": {"mode": "line"}},
        "thresholds": {"steps": [{"color": "transparent", "value": null},
         {"color": "orange", "value": 20}]}}}},
      {"id": 8, "type": "bargauge", "title": "Per-dimension mean (across entries)",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 0, "y": 18, "w": 12, "h": 8},
       "targets": [{"expr": "avg by(dimension)(eval_dimension_score{namespace=\"jcmcp\"})",
        "legendFormat": "{{dimension}}", "refId": "A"}],
       "options": {"displayMode": "gradient", "orientation": "horizontal"},
       "fieldConfig": {"defaults": {"links": [{"title": "Run detail \u2014 alerts, flips, flagged claims (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/evals/results", "targetBlank": true}], "min": 1, "max": 5, "decimals": 2,
        "thresholds": {"steps": [{"color": "red", "value": null},
         {"color": "orange", "value": 3}, {"color": "green", "value": 4}]}}}},
      {"id": 9, "type": "stat", "title": "Time since last suite run",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 12, "y": 18, "w": 6, "h": 8},
       "targets": [{"expr": "time() - max(eval_last_run_timestamp_seconds{namespace=\"jcmcp\",kind=\"suite\"})", "refId": "A", "instant": true}],
       "fieldConfig": {"defaults": {"unit": "s", "decimals": 0,
        "thresholds": {"steps": [{"color": "green", "value": null},
         {"color": "orange", "value": 604800}]}}}},
      {"id": 10, "type": "timeseries", "title": "Eval pushes by kind",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 18, "y": 18, "w": 6, "h": 8},
       "targets": [{"expr": "sum by(kind)(increase(eval_pushes_total{namespace=\"jcmcp\"}[1d]))",
        "legendFormat": "{{kind}}", "refId": "A"}]},
      {"id": 11, "type": "stat", "title": "Runs without provenance record",
       "description": "no_record bucket: judge scored a run the provenance audit never saw. Anything above 0 means hallucination agreement is unverifiable for those runs.",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 0, "y": 26, "w": 6, "h": 7},
       "targets": [{"expr": "sum(eval_provenance_agreement_count{namespace=\"jcmcp\",kind=\"no_record\"})", "refId": "A", "instant": true}],
       "fieldConfig": {"defaults": {"links": [{"title": "Run detail \u2014 alerts, flips, flagged claims (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/evals/results", "targetBlank": true}], "decimals": 0,
        "thresholds": {"steps": [{"color": "green", "value": null},
         {"color": "red", "value": 1}]}}}},
      {"id": 12, "type": "bargauge", "title": "Provenance agreement by bucket (raw counts)",
       "datasource": {"type": "prometheus", "uid": "prometheus"},
       "gridPos": {"x": 6, "y": 26, "w": 18, "h": 7},
       "targets": [{"expr": "sum by(kind)(eval_provenance_agreement_count{namespace=\"jcmcp\"})",
        "legendFormat": "{{kind}}", "refId": "A"}],
       "options": {"displayMode": "gradient", "orientation": "horizontal"},
       "fieldConfig": {"defaults": {"links": [{"title": "Run detail \u2014 alerts, flips, flagged claims (JSON; needs dashboard login)", "url": "https://jobcontext.ai/api/evals/results", "targetBlank": true}], "min": 0, "decimals": 0}}}
     ]
    }
