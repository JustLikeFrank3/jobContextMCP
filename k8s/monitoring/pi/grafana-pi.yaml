         "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"jcmcp\",status=~\"5..\"}[5m])) or vector(0)"}],
         "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color":"green","value":null},{"color":"red","value":0.01}]}}}},
        {"type": "stat", "title": "Work items (1h, prod)", "gridPos": {"x":12,"y":3,"w":4,"h":5},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(work_items_total{namespace=\"jcmcp\"}[1h])) or vector(0)"}]},
        {"type": "stat", "title": "LLM calls (1h, prod)", "gridPos": {"x":16,"y":3,"w":4,"h":5},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(llm_calls_total{namespace=\"jcmcp\"}[1h])) or vector(0)"}]},
        {"type": "stat", "title": "Gate pass rate (24h, prod)", "gridPos": {"x":20,"y":3,"w":4,"h":5},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "100 * sum(increase(provenance_checks_total{namespace=\"jcmcp\",verdict=\"passed\"}[24h])) / clamp_min(sum(increase(provenance_checks_total{namespace=\"jcmcp\"}[24h])), 1)"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"text","value":null},{"color":"red","value":1},{"color":"orange","value":80},{"color":"green","value":99}]}}}},
        {"type": "timeseries", "title": "Request rate by route (prod)", "gridPos": {"x":0,"y":8,"w":12,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"jcmcp\"}[5m])) by (route)", "legendFormat": "{{route}}"}],
         "fieldConfig": {"defaults": {"unit": "reqps"}}},
        {"type": "timeseries", "title": "Avg latency by route (prod)", "gridPos": {"x":12,"y":8,"w":12,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "rate(http_request_seconds_sum{namespace=\"jcmcp\"}[5m]) / rate(http_request_seconds_count{namespace=\"jcmcp\"}[5m])", "legendFormat": "{{route}}"}],
         "fieldConfig": {"defaults": {"unit": "s"}}},
        {"type": "timeseries", "title": "Work items by kind/status", "gridPos": {"x":0,"y":17,"w":8,"h":10},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(work_items_total[1h])) by (kind, status)", "legendFormat": "{{kind}}/{{status}}"}]},
        {"type": "timeseries", "title": "LLM tokens/hour by direction", "gridPos": {"x":8,"y":17,"w":8,"h":10},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(llm_tokens_total[1h])) by (model, direction)", "legendFormat": "{{model}} {{direction}}"}]},
        {"type": "timeseries", "title": "Provenance gate verdicts (prod)", "gridPos": {"x":16,"y":17,"w":8,"h":10},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum by(verdict)(increase(provenance_checks_total{namespace=~\"jcmcp|jcmcp-qa\"}[1h]))", "legendFormat": "{{verdict}}"}]}
      ]
    }
  kiosk-provenance.json: |
    {
      "uid": "kiosk-provenance",
      "title": "Provenance — Generation Truth Gate",
      "tags": [
        "kiosk"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "type": "text",
          "title": "",
          "transparent": true,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "# 🔎 PROVENANCE — generation truth gate · Node1 hardware"
          }
        },
        {
          "type": "stat",
          "title": "Checks (total)",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 4,
            "h": 6
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(provenance_runs_total) or vector(0)"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Pass rate",
          "gridPos": {
            "x": 4,
            "y": 3,
            "w": 4,
            "h": 6
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * sum(provenance_runs_total{verdict=\"passed\"}) / clamp_min(sum(provenance_runs_total), 1)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Violations caught",
          "gridPos": {
            "x": 8,
            "y": 3,
            "w": 4,
            "h": 6
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(provenance_violations_recorded_total) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "type": "gauge",
          "title": "CPU temp",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 4,
            "h": 6
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "avg(node_thermal_zone_temp)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 20,
              "max": 90,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 65
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            }
          }
        },
        {
          "type": "gauge",
          "title": "CPU",
          "gridPos": {
            "x": 16,
            "y": 3,
            "w": 4,
            "h": 6
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100*(1-avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            }
          }
        },
        {
          "type": "gauge",
          "title": "RAM",
          "gridPos": {
            "x": 20,
            "y": 3,
            "w": 4,
            "h": 6
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100*(1-node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Gate checks by verdict",
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by(verdict)(increase(provenance_checks_total[1h]))",
              "legendFormat": "{{verdict}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Violations over time",
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(provenance_violations_total[1h])) or vector(0)",
              "legendFormat": "violations/h"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Network eth0/wlan0",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{device=~\"eth0|wlan0\"}[5m])",
              "legendFormat": "rx {{device}}"
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{device=~\"eth0|wlan0\"}[5m])",
              "legendFormat": "tx {{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Disk I/O (SD + USB)",
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "rate(node_disk_written_bytes_total{device=~\"mmcblk0|sda\"}[5m])",
              "legendFormat": "write {{device}}"
            },
            {
              "expr": "rate(node_disk_read_bytes_total{device=~\"mmcblk0|sda\"}[5m])",
              "legendFormat": "read {{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        }
      ]
    }
  kiosk-evals.json: |
    {
      "uid": "kiosk-evals", "title": "Evals — resume quality (LLM-as-judge)", "tags": ["kiosk"],
      "timezone": "browser", "refresh": "1m", "schemaVersion": 39,
      "time": {"from": "now-7d", "to": "now"},
      "panels": [
        {"type": "text", "title": "", "transparent": true, "gridPos": {"x": 0, "y": 0, "w": 24, "h": 3},
         "options": {"mode": "markdown", "content": "# 🧪 EVALS — golden dataset · adversarial judge · N-run variance"}},
        {"type": "stat", "title": "Mean judge score (worst entry)", "gridPos": {"x": 0, "y": 3, "w": 5, "h": 6},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "min(eval_mean_score{namespace=\"jcmcp\"})"}],
         "fieldConfig": {"defaults": {"min": 1, "max": 5, "decimals": 2,
          "thresholds": {"steps": [{"color": "red", "value": null},
           {"color": "orange", "value": 3.8}, {"color": "green", "value": 4}]}}}},
        {"type": "stat", "title": "Hallucinations", "gridPos": {"x": 5, "y": 3, "w": 5, "h": 6},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "max(eval_hallucination_rate_pct{namespace=\"jcmcp\"})"}],
         "fieldConfig": {"defaults": {"unit": "percent", "decimals": 0,
          "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.001}]}}}},
        {"type": "stat", "title": "Verdict flips", "gridPos": {"x": 10, "y": 3, "w": 5, "h": 6},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "max(eval_verdict_flip_rate_pct{namespace=\"jcmcp\"})"}],
         "fieldConfig": {"defaults": {"unit": "percent", "decimals": 0,
          "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 20}]}}}},
        {"type": "stat", "title": "Layer 1 smoke", "gridPos": {"x": 15, "y": 3, "w": 5, "h": 6},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "max(eval_layer1_smoke_pass_rate_pct{namespace=\"jcmcp\"})"}],
         "fieldConfig": {"defaults": {"unit": "percent", "decimals": 0,
          "thresholds": {"steps": [{"color": "red", "value": null},
           {"color": "orange", "value": 95}, {"color": "green", "value": 100}]}}}},
        {"type": "stat", "title": "Alerts", "gridPos": {"x": 20, "y": 3, "w": 4, "h": 6},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "sum(max by(gd_id)(eval_alert_count{namespace=\"jcmcp\"})) or vector(0)"}],
         "fieldConfig": {"defaults": {"decimals": 0,
          "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}},
        {"type": "timeseries", "title": "Mean judge score by golden entry", "gridPos": {"x": 0, "y": 9, "w": 12, "h": 9},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "max by(gd_id)(eval_mean_score{namespace=\"jcmcp\"})", "legendFormat": "{{gd_id}}"}],
         "fieldConfig": {"defaults": {"min": 1, "max": 5,
          "custom": {"thresholdsStyle": {"mode": "line"}},
          "thresholds": {"steps": [{"color": "transparent", "value": null}, {"color": "red", "value": 3.8}]}}}},
        {"type": "timeseries", "title": "CoV % (instability) by golden entry", "gridPos": {"x": 12, "y": 9, "w": 12, "h": 9},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "max by(gd_id)(eval_cov_pct{namespace=\"jcmcp\"})", "legendFormat": "{{gd_id}}"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0,
          "custom": {"thresholdsStyle": {"mode": "line"}},
          "thresholds": {"steps": [{"color": "transparent", "value": null}, {"color": "orange", "value": 20}]}}}},
        {"type": "bargauge", "title": "Per-dimension mean (across entries)", "gridPos": {"x": 0, "y": 18, "w": 12, "h": 8},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "avg by(dimension)(eval_dimension_score{namespace=\"jcmcp\"})", "legendFormat": "{{dimension}}"}],
         "options": {"displayMode": "gradient", "orientation": "horizontal"},
         "fieldConfig": {"defaults": {"min": 1, "max": 5, "decimals": 2,
          "thresholds": {"steps": [{"color": "red", "value": null},
           {"color": "orange", "value": 3}, {"color": "green", "value": 4}]}}}},
        {"type": "stat", "title": "Time since last suite run", "gridPos": {"x": 12, "y": 18, "w": 6, "h": 8},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "time() - max(eval_last_run_timestamp_seconds{namespace=\"jcmcp\",kind=\"suite\"})"}],
         "fieldConfig": {"defaults": {"unit": "s", "decimals": 0,
          "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 604800}]}}}},
        {"type": "timeseries", "title": "Eval pushes by kind (1d)", "gridPos": {"x": 18, "y": 18, "w": 6, "h": 8},
         "datasource": {"uid": "prometheus"},
         "targets": [{"expr": "sum by(kind)(increase(eval_pushes_total{namespace=\"jcmcp\"}[1d]))", "legendFormat": "{{kind}}"}]}
      ]
    }
