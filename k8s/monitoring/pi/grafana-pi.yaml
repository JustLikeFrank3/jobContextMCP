# Pi-only Grafana extension:
#  - overrides the grafana-provisioning configmap (same name) to add the
#    Loki datasource alongside Prometheus
#  - adds a grafana-dashboard-pi configmap with the kiosk Cluster Health
#    dashboard; pi-deploy.sh patches the grafana deployment to mount it at
#    /var/lib/grafana/dashboards/pi (the base provider loads recursively).
# The wallboard rotation is OS-dependent: the workstation dual-boots, and
# the kiosk script picks a playlist by probing which GPU exporter is up
# (see pi-deploy.sh wallboard/kiosk-setup):
#    jcmcp-wallboard-linux:   kiosk-ollama + kiosk-cloud + kiosk-evals
#    jcmcp-wallboard-windows: kiosk-gaming + kiosk-cloud + kiosk-evals
# kiosk-gaming plots the same physical RTX 5060 Ti as kiosk-ollama — its
# gauges max() across both scrape jobs since only one OS is ever up.
# The other kiosk dashboards stay provisioned for manual viewing but are
# out of the rotation (pi-deploy.sh wallboard owns the playlist).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
      # AKS Prometheus via the outbound tunnel held by aks-prom-tunnel.service
      # on the Pi host (see pi-deploy.sh aks-feed) — reached at the Pi's
      # static direct-link address (DHCP-immune).
      - name: Prometheus-AKS
        uid: prometheus-aks
        type: prometheus
        access: proxy
        url: http://192.168.101.2:9091
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pi
  namespace: monitoring
data:
  kiosk-ollama.json: |
    {
      "uid": "kiosk-ollama", "title": "Local LLM — Ollama on the Workstation", "tags": ["kiosk"],
      "timezone": "browser", "refresh": "30s", "schemaVersion": 39,
      "time": {"from": "now-3h", "to": "now"},
      "panels": [
        {"type": "text", "title": "", "transparent": true, "gridPos": {"x": 0, "y": 0, "w": 24, "h": 3}, "options": {"mode": "markdown", "content": "# 🦙 LOCAL LLM — Ollama · qwen3-jobcontext · RTX 5060 Ti"}},
        {"type": "stat", "title": "Ollama", "gridPos": {"x":0,"y":3,"w":3,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(ollama_up{job=\"ollama-workstation\"}) or vector(0)"}],
         "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}]}}},
        {"type": "stat", "title": "Model in VRAM", "gridPos": {"x":3,"y":3,"w":4,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum by(model)(ollama_model_size_vram_bytes{job=\"ollama-workstation\"})", "legendFormat": "{{model}}"}],
         "fieldConfig": {"defaults": {"unit": "bytes"}},
         "options": {"textMode": "value_and_name"}},
        {"type": "stat", "title": "Context window", "gridPos": {"x":7,"y":3,"w":3,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(ollama_model_context_length{job=\"ollama-workstation\"})"}]},
        {"type": "gauge", "title": "GPU temp", "gridPos": {"x":10,"y":3,"w":3,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(gpu_temperature_celsius{job=\"ollama-workstation\"})"}],
         "fieldConfig": {"defaults": {"unit": "celsius", "min": 20, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":75},{"color":"red","value":90}]}}}},
        {"type": "gauge", "title": "GPU util", "gridPos": {"x":13,"y":3,"w":4,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(gpu_utilization_percent{job=\"ollama-workstation\"})"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":80},{"color":"red","value":95}]}}}},
        {"type": "gauge", "title": "VRAM used", "gridPos": {"x":17,"y":3,"w":4,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "100 * max(gpu_memory_used_bytes{job=\"ollama-workstation\"}) / max(gpu_memory_total_bytes{job=\"ollama-workstation\"})"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":85},{"color":"red","value":95}]}}}},
        {"type": "stat", "title": "Desktop app", "gridPos": {"x":21,"y":3,"w":3,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(jobcontext_desktop_up{job=\"ollama-workstation\"}) or vector(0)"}],
         "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}]}}},
        {"type": "timeseries", "title": "LLM calls (1h) by model/outcome", "gridPos": {"x":0,"y":9,"w":6,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(llm_calls_total{job=\"ollama-workstation\"}[1h])) by (model, outcome)", "legendFormat": "{{model}}/{{outcome}}"}]},
        {"type": "timeseries", "title": "LLM tokens/hour by direction", "gridPos": {"x":6,"y":9,"w":6,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(llm_tokens_total{job=\"ollama-workstation\"}[1h])) by (model, direction)", "legendFormat": "{{model}} {{direction}}"}]},
        {"type": "timeseries", "title": "Avg LLM call latency", "gridPos": {"x":12,"y":9,"w":6,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum by(model)(rate(llm_call_seconds_sum{job=\"ollama-workstation\"}[15m])) / sum by(model)(rate(llm_call_seconds_count{job=\"ollama-workstation\"}[15m]))", "legendFormat": "{{model}}"}],
         "fieldConfig": {"defaults": {"unit": "s"}}},
        {"type": "timeseries", "title": "Provenance gate runs by verdict", "gridPos": {"x":18,"y":9,"w":6,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum by(verdict)(provenance_runs_total{job=\"ollama-workstation\"})", "legendFormat": "{{verdict}}"}]},
        {"type": "timeseries", "title": "GPU utilization", "gridPos": {"x":0,"y":18,"w":8,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [
           {"expr": "max(gpu_utilization_percent{job=\"ollama-workstation\"})", "legendFormat": "workstation"},
           {"expr": "max(gpu_utilization_percent{job=\"gpu-windows\"})", "legendFormat": "flight-sim rig"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}},
        {"type": "stat", "title": "Gate pass rate", "gridPos": {"x":16,"y":18,"w":4,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "100 * sum(provenance_runs_total{job=\"ollama-workstation\",verdict=\"passed\"}) / clamp_min(sum(provenance_runs_total{job=\"ollama-workstation\"}), 1)"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"red","value":null},{"color":"orange","value":80},{"color":"green","value":99}]}}}},
        {"type": "stat", "title": "Gate runs", "gridPos": {"x":20,"y":18,"w":4,"h":5},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(provenance_runs_total{job=\"ollama-workstation\"}) or vector(0)"}]},
        {"type": "stat", "title": "Violations", "gridPos": {"x":20,"y":23,"w":4,"h":4},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(provenance_violations_recorded_total{job=\"ollama-workstation\"}) or vector(0)"}],
         "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":1}]}}}},
        {"type": "timeseries", "title": "VRAM", "gridPos": {"x":8,"y":18,"w":8,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [
           {"expr": "max(gpu_memory_used_bytes{job=\"ollama-workstation\"})", "legendFormat": "workstation used"},
           {"expr": "max(gpu_memory_total_bytes{job=\"ollama-workstation\"})", "legendFormat": "workstation total"},
           {"expr": "sum(ollama_model_size_vram_bytes{job=\"ollama-workstation\"})", "legendFormat": "ollama model"},
           {"expr": "max(gpu_memory_used_bytes{job=\"gpu-windows\"})", "legendFormat": "flight-sim rig used"}],
         "fieldConfig": {"defaults": {"unit": "bytes"}}}
      ]
    }
  kiosk-gaming.json: |
    {
      "uid": "kiosk-gaming", "title": "Flight Sim Rig — GPU (Windows)", "tags": ["kiosk"],
      "timezone": "browser", "refresh": "30s", "schemaVersion": 39,
      "time": {"from": "now-3h", "to": "now"},
      "panels": [
        {"type": "text", "title": "", "transparent": true, "gridPos": {"x": 0, "y": 0, "w": 24, "h": 3}, "options": {"mode": "markdown", "content": "# 🛩️ FLIGHT SIM RIG — RTX 5060 Ti · Windows"}},
        {"type": "stat", "title": "Flight-sim rig (Windows)", "gridPos": {"x":0,"y":3,"w":4,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(up{job=\"gpu-windows\"}) or vector(0)"}],
         "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}]}}},
        {"type": "stat", "title": "Workstation (Linux)", "gridPos": {"x":4,"y":3,"w":4,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(up{job=\"ollama-workstation\"}) or vector(0)"}],
         "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}]}}},
        {"type": "gauge", "title": "GPU util", "gridPos": {"x":8,"y":3,"w":6,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(gpu_utilization_percent{job=~\"ollama-workstation|gpu-windows\"})"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":80},{"color":"red","value":95}]}}}},
        {"type": "gauge", "title": "VRAM used", "gridPos": {"x":14,"y":3,"w":5,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "100 * max(gpu_memory_used_bytes{job=~\"ollama-workstation|gpu-windows\"}) / max(gpu_memory_total_bytes{job=~\"ollama-workstation|gpu-windows\"})"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":85},{"color":"red","value":95}]}}}},
        {"type": "gauge", "title": "GPU temp", "gridPos": {"x":19,"y":3,"w":5,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(gpu_temperature_celsius{job=~\"ollama-workstation|gpu-windows\"})"}],
         "fieldConfig": {"defaults": {"unit": "celsius", "min": 20, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":75},{"color":"red","value":90}]}}}},
        {"type": "timeseries", "title": "GPU utilization", "gridPos": {"x":0,"y":9,"w":12,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [
           {"expr": "max(gpu_utilization_percent{job=\"ollama-workstation\"})", "legendFormat": "workstation"},
           {"expr": "max(gpu_utilization_percent{job=\"gpu-windows\"})", "legendFormat": "flight-sim rig"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}},
        {"type": "timeseries", "title": "GPU temp", "gridPos": {"x":12,"y":9,"w":12,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [
           {"expr": "max(gpu_temperature_celsius{job=\"ollama-workstation\"})", "legendFormat": "workstation"},
           {"expr": "max(gpu_temperature_celsius{job=\"gpu-windows\"})", "legendFormat": "flight-sim rig"}],
         "fieldConfig": {"defaults": {"unit": "celsius"}}},
        {"type": "timeseries", "title": "VRAM", "gridPos": {"x":0,"y":18,"w":24,"h":9},
         "datasource": {"uid":"prometheus"},
         "targets": [
           {"expr": "max(gpu_memory_used_bytes{job=\"ollama-workstation\"})", "legendFormat": "workstation used"},
           {"expr": "max(gpu_memory_used_bytes{job=\"gpu-windows\"})", "legendFormat": "flight-sim rig used"},
           {"expr": "max(gpu_memory_total_bytes{job=~\"ollama-workstation|gpu-windows\"})", "legendFormat": "total"}],
         "fieldConfig": {"defaults": {"unit": "bytes"}}}
      ]
    }
  kiosk-app.json: |
    {
      "uid": "kiosk-app", "title": "Application Health — jobContext (Pi)", "tags": ["kiosk"],
      "timezone": "browser", "refresh": "30s", "schemaVersion": 39,
      "time": {"from": "now-3h", "to": "now"},
      "panels": [
        {"type": "text", "title": "", "transparent": true, "gridPos": {"x": 0, "y": 0, "w": 24, "h": 3}, "options": {"mode": "markdown", "content": "# \ud83d\udcf1 APPLICATION \u2014 jobContext on the Pi"}},
        {"type": "timeseries", "title": "Request rate by route", "gridPos": {"x":0,"y":3,"w":8,"h":8},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"jcmcp-pi\"}[5m])) by (route)", "legendFormat": "{{route}}"}],
         "fieldConfig": {"defaults": {"unit": "reqps"}}},
        {"type": "timeseries", "title": "Avg latency by route", "gridPos": {"x":8,"y":3,"w":8,"h":8},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "rate(http_request_seconds_sum{namespace=\"jcmcp-pi\"}[5m]) / rate(http_request_seconds_count{namespace=\"jcmcp-pi\"}[5m])", "legendFormat": "{{route}}"}],
         "fieldConfig": {"defaults": {"unit": "s"}}},
        {"type": "timeseries", "title": "5xx error rate", "gridPos": {"x":16,"y":3,"w":8,"h":8},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"jcmcp-pi\",status=~\"5..\"}[5m])) or vector(0)"}],
         "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color":"green","value":null},{"color":"red","value":0.01}]}}}},
        {"type": "timeseries", "title": "Work items (1h) by kind/status", "gridPos": {"x":0,"y":11,"w":8,"h":8},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(work_items_total{namespace=\"jcmcp-pi\"}[1h])) by (kind, status)", "legendFormat": "{{kind}}/{{status}}"}]},
        {"type": "timeseries", "title": "Avg work-item duration", "gridPos": {"x":8,"y":11,"w":8,"h":8},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "rate(work_item_seconds_sum{namespace=\"jcmcp-pi\"}[15m]) / rate(work_item_seconds_count{namespace=\"jcmcp-pi\"}[15m])", "legendFormat": "{{kind}}"}],
         "fieldConfig": {"defaults": {"unit": "s"}}},
        {"type": "timeseries", "title": "LLM calls by model/outcome", "gridPos": {"x":16,"y":11,"w":8,"h":8},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(llm_calls_total{namespace=\"jcmcp-pi\"}[1h])) by (model, outcome)", "legendFormat": "{{model}}/{{outcome}}"}]},
        {"type": "timeseries", "title": "LLM tokens/hour by direction", "gridPos": {"x":0,"y":19,"w":16,"h":8},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(llm_tokens_total{namespace=\"jcmcp-pi\"}[1h])) by (model, direction)", "legendFormat": "{{model}} {{direction}}"}]},
        {"type": "stat", "title": "App uptime", "gridPos": {"x":16,"y":19,"w":8,"h":8},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "max(process_uptime_seconds{namespace=\"jcmcp-pi\"})"}],
         "fieldConfig": {"defaults": {"unit": "s"}}}
      ]
    }
  kiosk-cluster.json: |
    {
      "uid": "kiosk-cluster", "title": "Cluster Health — Node1", "tags": ["kiosk"],
      "timezone": "browser", "refresh": "30s", "schemaVersion": 39,
      "time": {"from": "now-3h", "to": "now"},
      "panels": [
        {"type": "text", "title": "", "transparent": true, "gridPos": {"x": 0, "y": 0, "w": 24, "h": 3}, "options": {"mode": "markdown", "content": "# \ud83d\udda5\ufe0f CLUSTER \u2014 Node1 k3s: pods & hardware"}},
        {"type": "stat", "title": "Pods running", "gridPos": {"x":0,"y":3,"w":3,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\"})"}]},
        {"type": "stat", "title": "Pods down", "gridPos": {"x":3,"y":3,"w":3,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"}) or vector(0)"}],
         "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color":"green","value":null},{"color":"red","value":1}]}}}},
        {"type": "stat", "title": "Restarts (24h)", "gridPos": {"x":6,"y":3,"w":3,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total[24h])) or vector(0)"}],
         "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":5}]}}}},
        {"type": "gauge", "title": "CPU temp", "gridPos": {"x":9,"y":3,"w":4,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "avg(node_thermal_zone_temp)"}],
         "fieldConfig": {"defaults": {"unit": "celsius", "min": 20, "max": 90,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":65},{"color":"red","value":80}]}}}},
        {"type": "gauge", "title": "CPU", "gridPos": {"x":13,"y":3,"w":4,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "100*(1-avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":70},{"color":"red","value":90}]}}}},
        {"type": "gauge", "title": "RAM", "gridPos": {"x":17,"y":3,"w":4,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "100*(1-node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":75},{"color":"red","value":90}]}}}},
        {"type": "bargauge", "title": "Disk", "gridPos": {"x":21,"y":3,"w":3,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "100*(1-node_filesystem_avail_bytes{mountpoint=~\"/|/mnt/backup\"}/node_filesystem_size_bytes{mountpoint=~\"/|/mnt/backup\"})", "legendFormat": "{{mountpoint}}"}],
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
           "thresholds": {"steps": [{"color":"green","value":null},{"color":"orange","value":75},{"color":"red","value":90}]}}}},
        {"type": "timeseries", "title": "CPU by pod", "gridPos": {"x":0,"y":9,"w":12,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum by(pod)(rate(container_cpu_usage_seconds_total{container!=\"\",pod!=\"\"}[5m]))", "legendFormat": "{{pod}}"}],
         "fieldConfig": {"defaults": {"unit": "percentunit"}}},
        {"type": "timeseries", "title": "Memory by pod", "gridPos": {"x":12,"y":9,"w":12,"h":6},
         "datasource": {"uid":"prometheus"},
         "targets": [{"expr": "sum by(pod)(container_memory_working_set_bytes{container!=\"\",pod!=\"\"})", "legendFormat": "{{pod}}"}],
         "fieldConfig": {"defaults": {"unit": "bytes"}}},
        {"type": "timeseries", "title": "Network eth0/wlan0", "gridPos": {"x":0,"y":15,"w":12,"h":5},
         "datasource": {"uid":"prometheus"},
         "targets": [
           {"expr": "rate(node_network_receive_bytes_total{device=~\"eth0|wlan0\"}[5m])", "legendFormat": "rx {{device}}"},
           {"expr": "rate(node_network_transmit_bytes_total{device=~\"eth0|wlan0\"}[5m])", "legendFormat": "tx {{device}}"}],
         "fieldConfig": {"defaults": {"unit": "Bps"}}},
        {"type": "timeseries", "title": "Disk I/O (SD + USB)", "gridPos": {"x":12,"y":15,"w":12,"h":5},
         "datasource": {"uid":"prometheus"},
         "targets": [
           {"expr": "rate(node_disk_written_bytes_total{device=~\"mmcblk0|sda\"}[5m])", "legendFormat": "write {{device}}"},
           {"expr": "rate(node_disk_read_bytes_total{device=~\"mmcblk0|sda\"}[5m])", "legendFormat": "read {{device}}"}],
         "fieldConfig": {"defaults": {"unit": "Bps"}}},
        {"type": "logs", "title": "Errors — all namespaces", "gridPos": {"x":0,"y":20,"w":24,"h":7},
         "datasource": {"uid":"loki"},
         "options": {"showTime": true, "sortOrder": "Descending"},
         "targets": [{"expr": "{namespace=~\".+\"} |~ \"(?i)(error|traceback|exception|failed)\" != \"level=info\" != \"notifying scheduler\""}]}
      ]
    }
