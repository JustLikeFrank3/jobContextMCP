<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP bridge request sequence</title>
  <desc id="desc">On sign-in, the in-page bridge fetches tools/list and registers every tool verbatim. An in-browser agent calls document.modelContext. The bridge sends a same-origin POST with a session cookie to the stateless MCP endpoint. Its CSRF guard ignores cookies on cross-site requests. JSON-RPC results from the same 12 facades return through the bridge to the agent.</desc>
  <!-- Maintained source: edit the fixed coordinates and labels directly. No scripts or external resources. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9AA8BF"/>
    </marker>
  </defs>
  <rect width="1000" height="525" fill="#0F172A"/>
  <g stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 5">
    <path d="M150 82 V505"/><path d="M490 82 V505"/><path d="M830 82 V505"/>
  </g>
  <g fill="#16213A" stroke="#2E4366" stroke-width="1.2">
    <rect x="35" y="20" width="230" height="62" rx="7"/>
    <rect x="355" y="20" width="270" height="62" rx="7"/>
    <rect x="690" y="20" width="280" height="62" rx="7"/>
  </g>
  <g fill="#F2F6FC" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">
    <text x="150" y="56">In-browser agent</text>
    <text x="490" y="47">WebMCP bridge</text><text x="490" y="68" font-size="13">(in-page)</text>
    <text x="830" y="47">/mcp</text><text x="830" y="68" font-size="13">(stateless Streamable HTTP)</text>
  </g>
  <g fill="#1B2A44" stroke="#2E4366">
    <rect x="337" y="110" width="306" height="62" rx="4"/>
    <rect x="677" y="295" width="306" height="62" rx="4"/>
  </g>
  <g fill="#D7E3F8" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">
    <text x="490" y="136">on sign-in: fetch tools/list,</text>
    <text x="490" y="157">register every tool verbatim</text>
    <text x="830" y="321">CSRF guard: the cookie is</text>
    <text x="830" y="342">ignored on cross-site requests</text>
  </g>
  <g stroke="#9AA8BF" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M150 220 H490"/><path d="M490 275 H830"/>
    <path d="M830 425 H490" stroke-dasharray="5 4"/>
    <path d="M490 485 H150" stroke-dasharray="5 4"/>
  </g>
  <g fill="#D7E3F8" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">
    <text x="320" y="208">document.modelContext tool call</text>
    <text x="660" y="263">same-origin POST (session cookie)</text>
    <text x="660" y="395">JSON-RPC result from the same 12 facades</text>
    <text x="660" y="415">every MCP client gets</text>
    <text x="320" y="473">tool result</text>
  </g>
</svg>
