name: Security regressions

# Secretless PR verification only. This workflow cannot publish or deploy.
on:
  pull_request:
    branches: [qa, main]

permissions:
  contents: read

concurrency:
  group: security-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regressions:
    name: Auth, SQL, and browser CSP regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts --prefix frontend
      - name: Security and authentication regressions
        run: |
          python -m pytest tests/test_security_headers.py tests/test_dashboard_login_csrf.py \
            tests/test_dashboard_coverage.py tests/test_entra_auth.py tests/test_oauth_keybridge.py \
            tests/test_webmcp_csrf.py tests/test_eval_push_security.py tests/test_sql_security.py \
            tests/test_badge_api.py tests/test_badge_template_choices.py -q
          python -m unittest discover -s security/dast -p 'test_*.py' -v
          node --test security/browser/proxy.test.cjs
      - name: Build and test the real frontend
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Install pinned browser test tooling outside application dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke against disposable loopback-only app
        env:
          PLAYWRIGHT_TOOLS: ${{ runner.temp }}/browser-tools
        run: node security/browser/smoke.cjs
      - name: Retain synthetic browser evidence and app diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: security/browser/reports/
          retention-days: 14
          if-no-files-found: warn
