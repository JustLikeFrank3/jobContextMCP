name: Python SAST

# Secretless Python gate complements SonarCloud and works on qa and fork PRs.
# Reused by deploy.yml so a failed scan blocks build/publish/deployment.
on:
  pull_request:
    branches: [qa, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install scanner (not application dependencies)
        run: python -m pip install bandit==1.9.4
      - name: Scan Python application source
        # Medium/high severity AND medium/high confidence block. Existing
        # targeted nosec annotations remain honored; no blanket skips/baseline.
        run: |
          mkdir -p security/sast/reports
          python -m bandit -r lib tools services transport evals server.py cli.py desktop_main.py \
            -ll -ii -f json -o security/sast/reports/bandit.json
      - name: Reject incomplete scans
        # Bandit can report parser/read errors separately from findings.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('security/sast/reports/bandit.json').read_text())
          if report['errors'] or report['metrics']['_totals']['loc'] <= 0:
              raise SystemExit('Bandit scan incomplete: inspect the JSON report')
          PY
      - name: Retain findings even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-${{ github.run_id }}-${{ github.run_attempt }}
          path: security/sast/reports/bandit.json
          retention-days: 14
          if-no-files-found: warn
