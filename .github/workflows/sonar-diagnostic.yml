name: Temporary Sonar reliability diagnostic

# Read-only investigation of the failed main gate. Remove before merging.
on:
  pull_request:
    branches: [qa]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/sonar-diagnostic.yml]

permissions: {}

jobs:
  read-main-issues:
    if: >-
      github.repository == 'JustLikeFrank3/jobContextMCP' &&
      github.actor == 'JustLikeFrank3' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'security/sonar-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, repository code, third-party action, artifact, or deploy.
      - name: Read the fixed project's gate and reliability issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.pop('SONAR_TOKEN', '')
          if not token:
              raise SystemExit('SONAR_TOKEN is unavailable')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          project = 'JustLikeFrank3_jobContextMCP'
          allowed = {'qualitygates/project_status', 'issues/search'}

          def read(endpoint, params):
              assert endpoint in allowed
              url = 'https://sonarcloud.io/api/' + endpoint + '?' + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'{endpoint}: HTTP {error.code}') from None
              except (urllib.error.URLError, ValueError):
                  raise SystemExit(f'{endpoint}: request or JSON decoding failed') from None

          def emit(label, value):
              # Print only explicitly selected issue metadata, never headers/token/raw responses.
              print(json.dumps({'section': label, 'data': value}).replace(token, '[redacted]'))

          gate = read('qualitygates/project_status', {'projectKey': project, 'branch': 'main'})
          status = gate.get('projectStatus', {})
          emit('gate', {key: status.get(key) for key in ('status', 'conditions', 'period')})
          for page in range(1, 6):
              result = read('issues/search', {
                  'componentKeys': project, 'branch': 'main', 'resolved': 'false',
                  'sinceLeakPeriod': 'true', 'ps': 500, 'p': page,
              })
              paging = result.get('paging', {})
              for issue in result.get('issues', []):
                  impacts = issue.get('impacts', [])
                  if issue.get('type') == 'BUG' or any(
                      impact.get('softwareQuality') == 'RELIABILITY' for impact in impacts
                  ):
                      emit('reliability_issue', {key: issue.get(key) for key in (
                          'key', 'rule', 'component', 'line', 'textRange', 'type',
                          'severity', 'status', 'message', 'impacts',
                      )})
              total = paging.get('total', result.get('total', 0))
              if page * 500 >= total:
                  emit('scan_complete', {'open_new_code_issues_examined': total})
                  break
          else:
              raise SystemExit('Issue count exceeds bounded diagnostic limit (2500)')
          PY
