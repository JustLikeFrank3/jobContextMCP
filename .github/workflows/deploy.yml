name: Build & Deploy to AKS

on:
  push:
    branches:
      - qa
      - main
    # Docs-only pushes don't need a rebuild + redeploy of identical code.
    # (Mixed pushes that touch code AND docs still deploy.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mobile/**"
  workflow_dispatch:

env:
  ACR: jcmcpacr.azurecr.io
  IMAGE: jcmcpacr.azurecr.io/jcmcp
  AKS_CLUSTER: jcmcp-aks
  AKS_RG: jcmcp-rg
  K8S_NAMESPACE: jcmcp
  K8S_DEPLOYMENT: jcmcp
  K8S_CONTAINER: jcmcp
  LLM_PROVIDER: foundry
  FOUNDRY_ENDPOINT: https://jobcontextmcp-resource.services.ai.azure.com
  FOUNDRY_DEPLOYMENT: gpt-4.1-mini
  FOUNDRY_API_VERSION: 2025-01-01-preview
  STORAGE_ACCOUNT: jcmcpstore
  ENTRA_OWNER_OID: ${{ secrets.ENTRA_OWNER_OID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The whole suite, live_llm included — those tests bring their own mocked
      # client (they only opt out of the autouse offline stub), so nothing here
      # touches the network and the gate gets a few more tests for free. Running
      # the same selection the badges want means it measures once, not twice.
      - name: Run tests
        run: pytest --cov --cov-report=xml --junitxml=junit.xml

      # Layer 1 smoke gate (evals/): every non-network eval case runs against
      # an isolated throwaway workspace with fully verbose per-case logging
      # (invocation, expectations, tags, response excerpt). Smoke pass rate
      # <95% exits non-zero — this job fails and the deploy jobs never run.
      - name: Layer 1 smoke gate (verbose)
        run: python scripts/ci_smoke_gate.py

      - name: Upload measurements for the badge job
        uses: actions/upload-artifact@v4
        with:
          name: suite-measurements
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: error
          retention-days: 1

  badges:
    needs: test
    # Only on direct pushes to long-lived branches — never on PRs or manual runs,
    # and skip the commit the bot itself pushes (guarded by [skip ci] below).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Runtime deps only — this job no longer runs pytest, it just needs to
      # `import server` to count the MCP tools.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # The suite already ran in `test`; re-running it here cost ~90s and, more
      # to the point, widened the window in which concurrent badge jobs collide
      # on the push below.
      - name: Fetch measurements from the test job
        uses: actions/download-artifact@v4
        with:
          name: suite-measurements

      # Fails the job if any managed badge/stat string no longer matches its
      # pattern — the generator's whole purpose is that these numbers cannot
      # drift, so a skipped substitution must be loud, not a ::warning::.
      - name: Regenerate README badges
        run: python scripts/update_readme_badges.py --junit junit.xml --coverage coverage.xml --readme README.md --resume-section templates/latex_assets/sections/experience.tex

      # Several PRs merging to qa/main inside a couple of minutes put their
      # badge jobs in a footrace for this push, and the losers used to die on
      # "! [rejected] HEAD -> qa (fetch first)" — painting a run red whose
      # tests and deploy both passed. So: regenerate on top of whoever won and
      # try again. The regenerator is idempotent and rewrites only the stat
      # fields in place, so replaying it after resetting to the new tip keeps
      # any README prose that arrived on the winning push, and it recounts
      # tools against that tip too. If the winner already published identical
      # numbers there is nothing left to commit and we exit clean.
      - name: Commit badge changes if any
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          FILES="README.md templates/latex_assets/sections/experience.tex"
          REGEN="python scripts/update_readme_badges.py --junit junit.xml --coverage coverage.xml --readme README.md --resume-section templates/latex_assets/sections/experience.tex"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git diff --quiet -- $FILES; then
              echo "README badges & resume stats already current — nothing to commit."
              exit 0
            fi
            git add $FILES
            git commit -m "docs: auto-update README badges & resume stats [skip ci]"
            if git push origin HEAD:"$BRANCH"; then
              echo "Pushed badge update on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — another badge job reached $BRANCH first. Rebuilding on the new tip (attempt $attempt)."
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            $REGEN
          done
          echo "::error::Could not push the badge update after 5 attempts."
          exit 1

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Chrome origin-trial token for WebMCP (subdomain-matched for
          # jobcontext.ai). Empty until the secret exists — then plain
          # Chrome exposes document.modelContext on the dashboard with no
          # flags. Trial runs through Chrome 156 / Nov 16, 2026.
          build-args: |
            VITE_WEBMCP_OT_TOKEN=${{ secrets.WEBMCP_OT_TOKEN }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RG }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Deploy new image
        run: |
          # Substitute placeholders and apply configmap + deployment so all
          # changes are picked up on every deploy — not just the image tag.
          ACR_NAME=$(echo "${{ env.ACR }}" | cut -d. -f1)
          sed \
            -e "s|__LLM_PROVIDER__|${{ env.LLM_PROVIDER }}|g" \
            -e "s|__FOUNDRY_ENDPOINT__|${{ env.FOUNDRY_ENDPOINT }}|g" \
            -e "s|__FOUNDRY_DEPLOYMENT__|${{ env.FOUNDRY_DEPLOYMENT }}|g" \
            -e "s|__FOUNDRY_API_VERSION__|${{ env.FOUNDRY_API_VERSION }}|g" \
            -e "s|__STORAGE_ACCOUNT__|${{ env.STORAGE_ACCOUNT }}|g" \
            -e "s|__ENTRA_OWNER_OID__|${{ env.ENTRA_OWNER_OID }}|g" \
            k8s/configmap.yaml | kubectl apply -f - -n ${{ env.K8S_NAMESPACE }}
          sed "s|<ACR_NAME>|${ACR_NAME}|g; s|<IMAGE_TAG>|${{ github.sha }}|g" \
            k8s/deployment.yaml | \
            kubectl apply -f - -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/ingress.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

  build-and-deploy-qa:
    needs: test
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    env:
      QA_K8S_NAMESPACE: jcmcp-qa
      QA_K8S_DEPLOYMENT: jcmcp-qa
      # Non-sensitive QA config — mirrors prod Foundry setup by default.
      # Override by setting these as workflow env vars or GitHub variables.
      QA_LLM_PROVIDER: foundry
      QA_FOUNDRY_ENDPOINT: https://jobcontextmcp-resource.services.ai.azure.com
      QA_FOUNDRY_DEPLOYMENT: gpt-4.1-mini
      QA_FOUNDRY_API_VERSION: 2025-01-01-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push QA image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:qa-${{ github.sha }}
            ${{ env.IMAGE }}:qa-latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RG }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Deploy QA
        run: |
          ACR_NAME=$(echo "${{ env.ACR }}" | cut -d. -f1)
          sed \
            -e "s|__QA_LLM_PROVIDER__|${{ env.QA_LLM_PROVIDER }}|g" \
            -e "s|__QA_FOUNDRY_ENDPOINT__|${{ env.QA_FOUNDRY_ENDPOINT }}|g" \
            -e "s|__QA_FOUNDRY_DEPLOYMENT__|${{ env.QA_FOUNDRY_DEPLOYMENT }}|g" \
            -e "s|__QA_FOUNDRY_API_VERSION__|${{ env.QA_FOUNDRY_API_VERSION }}|g" \
            -e "s|__QA_STORAGE_ACCOUNT__|${{ secrets.QA_STORAGE_ACCOUNT }}|g" \
            -e "s|__QA_ENTRA_OWNER_OID__|${{ secrets.ENTRA_OWNER_OID }}|g" \
            k8s/qa/configmap.yaml | kubectl apply -f - -n ${{ env.QA_K8S_NAMESPACE }}
          sed "s|<ACR_NAME>|${ACR_NAME}|g; s|<IMAGE_TAG>|qa-${{ github.sha }}|g" \
            k8s/qa/deployment.yaml | \
            kubectl apply -f - -n ${{ env.QA_K8S_NAMESPACE }}
          kubectl apply -f k8s/qa/service.yaml -n ${{ env.QA_K8S_NAMESPACE }}
          kubectl apply -f k8s/qa/ingress.yaml -n ${{ env.QA_K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.QA_K8S_DEPLOYMENT }} \
            -n ${{ env.QA_K8S_NAMESPACE }} --timeout=300s
